[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bioqubo-studio"
version = "0.1.0"
description = "A local-first computational-biology optimization workbench."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Dhruv Parashar" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "streamlit>=1.42",
    "dimod>=0.12",
    "dwave-neal>=0.6",
    "dwave-tabu>=0.5",
]

[project.optional-dependencies]
biology = [
    "biopython>=1.85",
    "rdkit>=2024.9",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
bioqubo-offline-check = "bioqubo.offline_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bioqubo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
